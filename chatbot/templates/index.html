<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Multilingual Chat 💬</title>

  <style>
    /* 🌑 Fullscreen dark background */
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #fff;
    }

    /* 💬 Chat container */
    #chat-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: #111827;
      border-radius: 0;
      overflow: hidden;
    }

    /* 🔹 Header */
    #chat-header {
      background: linear-gradient(135deg, #dc2626, #ea580c);
      color: #fff;
      padding: 16px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* 🗨️ Chat body */
    #chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #1e293b;
    }

    /* 💬 Messages */
    .user-msg, .bot-msg {
      padding: 12px 16px;
      border-radius: 20px;
      max-width: 70%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
      font-size: 15px;
      line-height: 1.4;
    }

    .user-msg {
      background: linear-gradient(135deg, #dc2626, #ea580c);
      color: #fff;
      align-self: flex-end;
      border-radius: 20px 20px 0 20px;
      box-shadow: 0 3px 10px rgba(220, 38, 38, 0.3);
    }

    .bot-msg {
      background: #334155;
      color: #f8fafc;
      align-self: flex-start;
      border-radius: 20px 20px 20px 0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* 🧠 Input area */
    #chat-input {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 1px solid #475569;
      background: #0f172a;
      padding: 10px;
    }

    #user-input {
      width: 80%;
      padding: 10px 16px;
      border-radius: 25px;
      border: 1px solid #475569;
      outline: none;
      font-size: 16px;
      margin-right: 10px;
      background: #1e293b;
      color: #fff;
    }

    #send-btn, #mic-btn {
      background: linear-gradient(135deg, #dc2626, #ea580c);
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      margin-left: 6px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      transition: 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #send-btn:hover, #mic-btn:hover {
      background: linear-gradient(135deg, #b91c1c, #dc2626);
      transform: scale(1.1);
    }

    #mic-btn.recording {
      background-color: #ef4444;
      animation: pulse 1s infinite;
    }

    #waveform {
      width: 80%;
      height: 40px;
      margin: 10px auto;
      background: transparent;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <!-- 💬 Fullscreen Chat UI -->
  <div id="chat-box">
    <div id="chat-header">Offline Multilingual Assistant 💬</div>

    <div id="chat-body"></div>

    <div id="chat-input">
      <canvas id="waveform"></canvas>
      <div style="display:flex;align-items:center;justify-content:center;width:100%;">
        <input id="user-input" type="text" placeholder="Type your message..." />
        <button id="mic-btn">🎙️</button>
        <button id="send-btn">➤</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
