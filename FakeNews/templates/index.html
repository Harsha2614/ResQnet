<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detection</title>

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', Arial, sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
          color: #f1f5f9;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          padding-top: 60px;
          position: relative;
          overflow-x: hidden;
        }

        /* 🔹 Animated diagonal pattern */
        body::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-image:
            repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(220, 38, 38, 0.03) 35px, rgba(220, 38, 38, 0.03) 70px),
            repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(234, 179, 8, 0.03) 35px, rgba(234, 179, 8, 0.03) 70px);
          animation: slide 20s linear infinite;
          z-index: 0;
        }

        @keyframes slide {
          0% { background-position: 0 0, 0 0; }
          100% { background-position: 70px 70px, -70px 70px; }
        }

        /* 🔹 Subtle glowing gradients */
        body::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background:
            radial-gradient(circle at 15% 20%, rgba(220, 38, 38, 0.1) 0%, transparent 40%),
            radial-gradient(circle at 85% 80%, rgba(234, 179, 8, 0.1) 0%, transparent 40%),
            radial-gradient(circle at 50% 50%, rgba(239, 68, 68, 0.05) 0%, transparent 60%);
          animation: pulse 8s ease-in-out infinite;
          z-index: 0;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.8; }
        }

        /* 🔹 Frosted-glass card container */
        .container {
          position: relative;
          z-index: 2;
          background: rgba(30, 41, 59, 0.8);
          backdrop-filter: blur(20px);
          padding: 40px;
          width: 700px;
          max-width: 90%;
          margin: auto;
          border-radius: 20px;
          border: 1.5px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
          animation: fadeInUp 0.8s ease-out;
          text-align: center;
        }

        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(40px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .container h1 {
          font-size: 28px;
          font-weight: 700;
          background: linear-gradient(135deg, #fbbf24, #f59e0b);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 20px;
        }

        textarea {
          width: 100%;
          height: 150px;
          padding: 15px;
          border-radius: 12px;
          border: 2px solid #334155;
          background: rgba(15, 23, 42, 0.9);
          color: #f1f5f9;
          font-size: 15px;
          outline: none;
          resize: none;
          transition: all 0.3s ease;
        }

        textarea:focus {
          border-color: #dc2626;
          box-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
        }

        button {
          background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);
          color: white;
          border: none;
          padding: 14px 30px;
          margin-top: 20px;
          border-radius: 12px;
          cursor: pointer;
          font-size: 16px;
          font-weight: 600;
          box-shadow: 0 8px 20px rgba(220, 38, 38, 0.4);
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
        }

        button::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
          transition: left 0.5s;
        }

        button:hover::before {
          left: 100%;
        }

        button:hover {
          transform: translateY(-3px);
          box-shadow: 0 12px 35px rgba(220, 38, 38, 0.6);
        }

        .results {
          margin-top: 25px;
          background: rgba(15, 23, 42, 0.7);
          color: #f8fafc;
          padding: 25px;
          border-radius: 12px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          font-size: 15px;
          line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📰 Fake News Detection App</h1>

    <!-- ✅ Correct POST target for backend running on port 7000 -->
    <form action="http://127.0.0.1:7000/predict" method="POST">
        <textarea name="news" placeholder="Paste news article text here..." required></textarea>
        <br>
        <button type="submit">Check News</button>
    </form>

    {% if news %}
    <div class="results">
        <h3>Entered Text:</h3>
        <p>{{ news }}</p>
        <h3>Predictions:</h3>
        <ul>
            <li><b>Random Forest:</b> {{ pred_rfc }}</li>
        </ul>
    </div>
    {% endif %}
</div>
</body>
</html>
