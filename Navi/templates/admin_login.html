{% extends "layout.html" %}
{% block content %}
<section class="panel narrow">
  <h2>Admin Login</h2>
  <form method="post" class="form">
    <label>Username
      <input name="username" required>
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <button type="submit">Login</button>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
  </form>
</section>
{% endblock %}
